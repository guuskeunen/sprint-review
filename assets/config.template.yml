# sprint-review configuration
# Full reference: https://github.com/guuskeunen/sprint-review/blob/main/docs/configuration.md

product:
  name: {{name}}
  # One or two sentences on what the product is and who uses it. The AI uses this to explain
  # changes in terms your audience knows.
  description: {{description}}

# Shown on the cover and the "What we gain" slide.
organization: ""

# Who watches the review: business, executives, customers, team, or your own description.
audience: {{audience}}

# The language of the slides: a name (English, Dutch, German, French, Spanish) or a code like nl or de-DE.
# The AI writes in any language; slide labels ship in these five and fall back to English (see labels).
language: English

sprint:
  days: 14
  # branch: develop      # read the sprint from this branch (origin/develop when fetched), whatever is checked out

# Your brand: the logo, color and fonts come from your website. What you set below wins over it.
brand:
  {{website}}
  # color: "#4f46e5"
  # logo: ./logo.png                    # PNG, JPG, SVG or WebP
  # from: ./our-template.pptx           # or take them from your own PowerPoint
  # theme: light                        # light or dark
  # fonts: { heading: "Playfair Display", body: Inter }

# Folders with product code. Commits that only touch other files (tests, CI, docs) can only go
# under the hood. Leave empty to treat every commit as product work.
productPaths:
  # - src/
  # - app/

# Commits whose subject matches one of these patterns are skipped entirely.
ignore:
  - "^chore\\(release\\)"
  - "^Merge "

# Words the AI tends to get wrong, with the word your team uses.
# replace:
#   customer: client

# Extra writing rules, in your own words.
# rules:
#   - Call the mobile app "the app", never "the mobile client".

# Before and after screenshots (optional). See docs/screenshots.md.
# screenshots:
#   source: git                          # git, folder, capture or none
#   dir: e2e/__screenshots__             # where your visual test pictures live
#   names:
#     dashboard: Dashboard
#     customer-page: Customer page
#   ignore: { left: 240, top: 64 }       # side menu and top bar, in pixels

# Milestones: lines like "- [x] Online booking" in this file become the roadmap slide.
roadmap: ROADMAP.md

# Usage numbers (optional): a JSON file you produce, like
# [{ "label": "orders placed", "value": 312, "previous": 268 }]
# usage: ./usage.json

# Let the writer rewrite the lines the second reader got stuck on, once.
revise: true

# Pull request descriptions as context: auto uses GITHUB_TOKEN when it's set.
# github: { pullRequests: auto }

# Post the summary to Slack after each run (webhook from SLACK_WEBHOOK_URL).
# slack: true

model:
  provider: anthropic                    # or openai (then set name)
  name: claude-opus-5-5
  fallback: claude-sonnet-5-5

output:
  dir: sprint-reviews
  markdown: true
  pptx: false                            # also write deck.pptx
